  <text data-slot="eyebrow" x="108" y="176" fill="#173845" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="40" font-weight="700" text-anchor="start">
    <tspan x="108" dy="0">为什么交付难</tspan>
  </text>
  <text data-slot="title" x="104" y="316" fill="#102C35" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="82" font-weight="800" text-anchor="start">
    <tspan x="104" dy="0">一进团队场景</tspan>
    <tspan x="104" dy="92">问题就不只是安装了</tspan>
  </text>
  <text data-slot="subtitle" x="108" y="478" fill="#46626B" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="34" font-weight="500" text-anchor="start">
    <tspan x="108" dy="0">真正麻烦的是每个人机器和习惯不同 结果很难对齐</tspan>
  </text>
  <text data-slot="cardA" x="156" y="760" fill="#173845" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="40" font-weight="700" text-anchor="start">
    <tspan x="156" dy="0">机器不同</tspan>
  </text>
  <text data-slot="cardAL1" x="156" y="846" fill="#46626B" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="28" font-weight="400" text-anchor="start">
    <tspan x="156" dy="0">系统不同</tspan>
  </text>
  <text data-slot="cardAL2" x="156" y="892" fill="#46626B" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="28" font-weight="400" text-anchor="start">
    <tspan x="156" dy="0">环境不同</tspan>
  </text>
  <text data-slot="cardAL3" x="156" y="938" fill="#46626B" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="28" font-weight="400" text-anchor="start">
    <tspan x="156" dy="0">依赖也不同</tspan>
  </text>
  <text data-slot="cardB" x="510" y="760" fill="#173845" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="40" font-weight="700" text-anchor="start">
    <tspan x="510" dy="0">习惯不同</tspan>
  </text>
  <text data-slot="cardBL1" x="510" y="846" fill="#46626B" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="28" font-weight="400" text-anchor="start">
    <tspan x="510" dy="0">有人会命令行</tspan>
  </text>
  <text data-slot="cardBL2" x="510" y="892" fill="#46626B" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="28" font-weight="400" text-anchor="start">
