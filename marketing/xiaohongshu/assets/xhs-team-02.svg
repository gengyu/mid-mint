  <text data-slot="cardBL3" x="510" y="938" fill="#46626B" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="28" font-weight="400" text-anchor="start">
    <tspan x="510" dy="0">理解成本不同</tspan>
  </text>
  <text data-slot="cardC" x="864" y="760" fill="#173845" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="40" font-weight="700" text-anchor="start">
    <tspan x="864" dy="0">结果不同</tspan>
  </text>
  <text data-slot="cardCL1" x="864" y="846" fill="#46626B" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="28" font-weight="400" text-anchor="start">
    <tspan x="864" dy="0">配置不一致</tspan>
  </text>
  <text data-slot="cardCL2" x="864" y="892" fill="#46626B" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="28" font-weight="400" text-anchor="start">
