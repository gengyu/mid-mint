  </text>
  <text data-slot="footer" x="128" y="1468" fill="#FFF8EF" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="38" font-weight="700" text-anchor="start">
    <tspan x="128" dy="0">只要交付对象一多 入口不统一就会放大沟通成本</tspan>
