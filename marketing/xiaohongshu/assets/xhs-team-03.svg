<svg width="1242" height="1660" viewBox="0 0 1242 1660" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1242" height="1660" rx="60" fill="url(#bg)"></rect>
  <rect x="108" y="620" width="440" height="720" rx="36" fill="#163A45" stroke="#2F606F" stroke-width="2"></rect>
  <rect x="680" y="620" width="454" height="720" rx="36" fill="#FFF8EF" stroke="#F2D8C5" stroke-width="3"></rect>
  <rect x="108" y="1422" width="1024" height="120" rx="30" fill="#FF6B3D"></rect>
  <circle cx="1078" cy="180" r="170" fill="#1B4654" fill-opacity="0.6"></circle>
  <circle cx="176" cy="1458" r="220" fill="#194350" fill-opacity="0.5"></circle>
  <text data-slot="eyebrow" x="108" y="170" fill="#7EF1E0" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="40" font-weight="700" text-anchor="start">
    <tspan x="108" dy="0">统一入口能解决</tspan>
  </text>
  <text data-slot="title" x="104" y="312" fill="#FFF8EF" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="82" font-weight="800" text-anchor="start">
    <tspan x="104" dy="0">把安装和配置都收进一</tspan>
    <tspan x="104" dy="94">个入口</tspan>
  </text>
  <text data-slot="subtitle" x="108" y="480" fill="#BFE3DC" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="34" font-weight="500" text-anchor="start">
    <tspan x="108" dy="0">不是让流程变复杂 而是让不同人走同一条路径</tspan>
  </text>
  <text data-slot="leftLabel" x="140" y="708" fill="#7EF1E0" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="28" font-weight="700" text-anchor="start">
    <tspan x="140" dy="0">对团队成员</tspan>
  </text>
  <text data-slot="leftTitle" x="140" y="798" fill="#FFF8EF" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="52" font-weight="800" text-anchor="start">
    <tspan x="140" dy="0">步骤更清楚</tspan>
  </text>
  <text data-slot="leftBody" x="140" y="970" fill="#DDEBE6" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="30" font-weight="400" text-anchor="start">
    <tspan x="140" dy="0">从环境检测到模型配置</tspan>
    <tspan x="140" dy="40">每一步都知道该点哪里</tspan>
    <tspan x="140" dy="40">看到什么结果</tspan>
  </text>
  <text data-slot="rightLabel" x="712" y="708" fill="#FF9F5C" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="28" font-weight="700" text-anchor="start">
    <tspan x="712" dy="0">对交付人</tspan>
  </text>
  <text data-slot="rightTitle" x="712" y="798" fill="#173845" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="52" font-weight="800" text-anchor="start">
    <tspan x="712" dy="0">状态更一致</tspan>
  </text>
  <text data-slot="rightBody" x="712" y="970" fill="#46626B" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="30" font-weight="400" text-anchor="start">
    <tspan x="712" dy="0">插件 workspace</tspan>
    <tspan x="712" dy="40">和常用配置更容易对齐</tspan>
    <tspan x="712" dy="40">更新和排查也更标准化</tspan>
  </text>
  <text data-slot="footer" x="128" y="1496" fill="#FFF8EF" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="38" font-weight="700" text-anchor="start">
    <tspan x="128" dy="0">统一入口本质上是在减少重复答疑和重复返工</tspan>
  </text>
  <defs>
    <linearGradient id="bg" x1="1242" y1="0" x2="0" y2="1660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173845"></stop>
      <stop offset="0.58" stop-color="#13313B"></stop>
      <stop offset="1" stop-color="#0D252D"></stop>
    </linearGradient>
  </defs>
