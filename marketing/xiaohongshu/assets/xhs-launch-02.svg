    <tspan x="712" dy="62">检测 + 入口</tspan>
  </text>
  <text data-slot="rightBody" x="712" y="970" fill="#46626B" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="30" font-weight="400" text-anchor="start">
