  </text>
  <text data-slot="title" x="104" y="312" fill="#FFF8EF" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="82" font-weight="800" text-anchor="start">
    <tspan x="104" dy="0">它不是 OpenClaw 本体</tspan>
  </text>
  <text data-slot="subtitle" x="108" y="480" fill="#BFE3DC" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="34" font-weight="500" text-anchor="start">
    <tspan x="108" dy="0">更像一个把安装和配置收起来的桌面工作台</tspan>
  </text>
  <text data-slot="leftLabel" x="140" y="708" fill="#7EF1E0" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="28" font-weight="700" text-anchor="start">
    <tspan x="140" dy="0">以前</tspan>
  </text>
  <text data-slot="leftTitle" x="140" y="798" fill="#FFF8EF" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="52" font-weight="800" text-anchor="start">
    <tspan x="140" dy="0">命令行 +</tspan>
    <tspan x="140" dy="62">JSON + 文档</tspan>
  </text>
  <text data-slot="leftBody" x="140" y="970" fill="#DDEBE6" font-family="&apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="30" font-weight="400" text-anchor="start">
